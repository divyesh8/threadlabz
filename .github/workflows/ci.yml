name: Quality checks
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ENV: local
      NEXT_PUBLIC_APP_ENV: local
      CHECKOUT_MODE: disabled
      SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      RAZORPAY_KEY_ID: ''
      RAZORPAY_KEY_SECRET: ''
      RAZORPAY_WEBHOOK_SECRET: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:migrations
      - run: npm run build
      - name: Diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - run: git diff --exit-code -- package.json package-lock.json supabase/migrations
      # No deploy step, remote secrets, migration push or production job.
