<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EDE5" />
      <stop offset="100%" stop-color="#EADBCE" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A74224" stroke-width="0.5" opacity="0.1" />
    </pattern>
  </defs>
  <rect width="600" height="750" fill="url(#bg)" />
  <rect width="600" height="750" fill="url(#grid)" />
  
  <rect x="30" y="30" width="540" height="690" rx="16" fill="none" stroke="#A74224" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 4" />
  
  <!-- Monogram Watermark -->
  <circle cx="300" cy="330" r="110" fill="#A74224" opacity="0.08" />
  <text x="300" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="90" text-anchor="middle" fill="#A74224" opacity="0.9">🪔</text>
  
  <!-- Label -->
  <text x="300" y="490" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" text-anchor="middle" fill="#2B2625">Festive Silk Kurta</text>
  <text x="300" y="525" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" text-anchor="middle" fill="#A74224" letter-spacing="2">ETHNIC MEN</text>
  
  <!-- Brand watermark -->
  <text x="300" y="660" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle" fill="#78716C" letter-spacing="3">THREADLABZ • MAKE YOUR MARK</text>
</svg>